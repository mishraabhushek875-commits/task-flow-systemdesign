events {}

http {
  # 'app' Docker Compose service-name hai — jab scale hoga (app=3), Docker
  # internally saare 3 container IPs isi naam ke peeche resolve karta hai.
  # Nginx default mein round-robin karta hai — ek-ek request alag instance ko.
  upstream taskflow_backend {
    server app:5000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://taskflow_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}